name: Maintenance Tests

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/scripts/**'
      - 'tests/**'
      - '.github/workflows/maintenance-tests.yml'
  push:
    branches: [master]
    paths:
      - '.github/scripts/**'
      - 'tests/**'
      - '.github/workflows/maintenance-tests.yml'

permissions:
  contents: read

concurrency:
  group: maintenance-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline merge policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/scripts/
            /tests/
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate merge gates without GitHub access
        run: python -m unittest discover -s tests -v
